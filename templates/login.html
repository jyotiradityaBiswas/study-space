<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | StudySpace</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-brand">
                <h1>StudySpace</h1>
                <p>Of the students, for the students, by the students.</p>
            </div>

            <div class="auth-card">

                <h2>Welcome back</h2>

                <p class="auth-description">
                    Log in to continue to your StudySpace account.
                </p>

                <form method="POST" class="auth-form">

                    <div>
                        <label for="username">
                            Username
                        </label>

                        <input
                            id="username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div>
                        <label for="password">
                            Password
                        </label>

                        <div class="password-input-wrapper">
                            <input
                                id="password"
                                name="password"
                                type="password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                aria-label="Show password"
                                aria-controls="password"
                            >
                                <img
                                    src="{{ url_for('static', filename='images/eye.svg') }}"
                                    alt=""
                                >
                            </button>
                        </div>
                    </div>

                    {% if error %}
                        <p class="auth-error">{{ error }}</p>
                    {% endif %}

                    <button type="submit">
                        Log in
                    </button>

                </form>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="{{ url_for('register') }}">
                        Create one
                    </a>
                </p>

            </div>

            <p class="auth-footer">
                Class 8 · 2026–27
            </p>

        </div>

    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
